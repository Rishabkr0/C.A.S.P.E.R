<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.S.P.E.R. Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
        }

        /* Top-center Island Card (Mac Notch / Dynamic Island style) */
        .island-card {
            position: fixed;
            top: 0;
            left: var(--card-x, calc(50% - 146px));
            transform: translateY(0);
            width: 292px;
            background: #000000;
            border-radius: 0 0 24px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: none;
            box-shadow: none;
            padding: 22px 20px 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        padding 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.4s ease;
            height: 196px; /* Default height for normal voice/assistant mode */
            cursor: ew-resize;
        }

        .island-card.is-dragging {
            cursor: grabbing !important;
            user-select: none;
        }

        .island-card button,
        .island-card input,
        .island-card .progress-container,
        .island-card .ctrl-btn {
            cursor: pointer;
        }

        .drag-handle {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 8px;
            margin-top: auto;
            cursor: ew-resize;
            pointer-events: none;
        }

        .drag-pill {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
        }

        .island-card:hover .drag-pill {
            background: rgba(255, 255, 255, 0.45);
        }

        .island-card.is-dragging .drag-pill {
            width: 52px;
            background: #30d158;
            box-shadow: 0 0 8px rgba(48, 209, 88, 0.4);
        }

        /* Hidden startup / off state */
        body.state-hidden .island-card {
            transform: translateY(-100%);
            opacity: 0;
        }

        /* ----------------------------------------------------
           NEON GLOW CURSOR TRAIL CANVAS (DISABLED)
           ---------------------------------------------------- */
        #neon-trail-canvas {
            display: none !important;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999998;
        }

        /* ----------------------------------------------------
           EYES & PUPILS
           ---------------------------------------------------- */
        .eyes-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 15px;
            transition: gap 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        margin-bottom 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center center;
        }

        /* Default Large Eyes (Image 1) */
        .eye {
            width: 34px;
            height: 70px;
            background: #ffffff;
            border-radius: 17px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform-origin: center center;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
            transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.45s ease,
                        transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth Blinking */
        .eye.blinking {
            transform: scaleY(0.04) !important;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        /* Speaking subtle bounce/pulse */
        body.state-speaking .eye:not(.blinking) {
            animation: speakBounce 0.45s ease-in-out infinite alternate;
        }

        @keyframes speakBounce {
            0% { transform: scaleY(0.94); }
            100% { transform: scaleY(1.05); }
        }

        /* Pupil inside eye */
        .pupil {
            position: absolute;
            width: 7px;
            height: 13px;
            background: #000000;
            border-radius: 4px;
            opacity: 0;
            transform: scale(0.3);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* ----------------------------------------------------
           COMPACT / MINI EYES WITH SCANNING PUPILS (Image 2)
           ---------------------------------------------------- */
        .island-card.mode-compact .eyes-container,
        .island-card.mode-music .eyes-container,
        .island-card.mode-thinking .eyes-container {
            gap: 22px;
            margin-bottom: 9px;
        }

        .island-card.mode-compact .eye,
        .island-card.mode-music .eye,
        .island-card.mode-thinking .eye {
            width: 20px;
            height: 36px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
        }

        /* Pupil appears and scans from left to right smoothly */
        .island-card.mode-compact .pupil,
        .island-card.mode-music .pupil,
        .island-card.mode-thinking .pupil {
            opacity: 1;
            transform: scale(1);
            animation: scanPupil 2.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes scanPupil {
            0%, 15% {
                transform: translateX(-4.5px);
            }
            45%, 65% {
                transform: translateX(4.5px);
            }
            85%, 100% {
                transform: translateX(-4.5px);
            }
        }

        /* ----------------------------------------------------
           STATUS ROW (Image 1 & 2)
           ---------------------------------------------------- */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #30d158;
            box-shadow: 0 0 8px rgba(48, 209, 88, 0.8);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 12px;
            color: #b5b5ba;
            font-weight: 500;
            letter-spacing: -0.1px;
            white-space: nowrap;
        }

        /* Animated Audio Waveform */
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 2.5px;
            height: 16px;
        }

        .wave-bar {
            width: 2.5px;
            background-color: #30d158;
            border-radius: 2px;
            height: 4px;
            transition: background-color 0.3s ease, height 0.2s ease;
        }

        .wave-bar.active {
            animation: waveBounce 0.9s infinite ease-in-out;
        }

        .wave-bar.bar-1 { animation-delay: 0s; }
        .wave-bar.bar-2 { animation-delay: -0.22s; }
        .wave-bar.bar-3 { animation-delay: -0.45s; }
        .wave-bar.bar-4 { animation-delay: -0.68s; }

        @keyframes waveBounce {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        /* Status colors */
        body.state-speaking .status-dot {
            background-color: #0a84ff;
            box-shadow: 0 0 8px rgba(10, 132, 255, 0.8);
        }
        body.state-speaking .wave-bar {
            background-color: #0a84ff;
        }

        body.state-thinking .status-dot,
        body.state-waiting .status-dot {
            background-color: #ff9f0a;
            box-shadow: 0 0 8px rgba(255, 159, 10, 0.8);
        }
        body.state-thinking .wave-bar,
        body.state-waiting .wave-bar {
            background-color: #ff9f0a;
        }

        body.state-tool .status-dot {
            background-color: #bf5af2;
            box-shadow: 0 0 8px rgba(191, 90, 242, 0.8);
        }
        body.state-tool .wave-bar {
            background-color: #bf5af2;
        }

        /* ----------------------------------------------------
           SUBTITLE ROW (Image 1)
           ---------------------------------------------------- */
        .subtitle-row {
            width: 100%;
            margin-top: 6px;
            padding: 0 4px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            transition: opacity 0.3s ease, margin 0.3s ease;
        }

        .subtitle-text {
            font-size: 13px;
            color: #ffffff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ----------------------------------------------------
           MUSIC / EXPANDED CARD SECTION (Image 2)
           ---------------------------------------------------- */
                /* ----------------------------------------------------
           TODO / BACKGROUND WORKER OVERLAY SECTION
           ---------------------------------------------------- */
        .island-card.mode-todo {
            min-height: 220px;
            height: auto;
            max-height: 460px;
            padding: 14px 18px 14px 18px;
        }

        .island-card.mode-todo .eyes-container {
            gap: 22px;
            margin-bottom: 8px;
        }

        .island-card.mode-todo .eye {
            width: 20px;
            height: 36px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
        }

        .island-card.mode-todo .pupil {
            opacity: 1;
            transform: scale(1);
            animation: scanPupil 2.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .island-card.mode-todo .subtitle-row,
        .island-card.mode-todo .music-section {
            display: none !important;
        }

        .todo-section {
            width: 100%;
            display: none;
            flex-direction: column;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .island-card.mode-todo .todo-section {
            display: flex;
            opacity: 1;
        }

        .todo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding-bottom: 7px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
        }

        .todo-header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .todo-badge {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(191, 90, 242, 0.2);
            color: #d175ff;
            border: 1px solid rgba(191, 90, 242, 0.4);
            white-space: nowrap;
        }

        .todo-title {
            font-size: 12px;
            font-weight: 600;
            color: #efeff4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .todo-counter {
            font-size: 11px;
            color: #8e8e93;
            font-weight: 600;
            flex-shrink: 0;
        }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .todo-list::-webkit-scrollbar {
            width: 4px;
        }
        .todo-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
        }

        .todo-item.done {
            background: rgba(48, 209, 88, 0.06);
            border-color: rgba(48, 209, 88, 0.25);
        }

        .todo-item.in_progress {
            background: rgba(10, 132, 255, 0.09);
            border-color: rgba(10, 132, 255, 0.4);
            box-shadow: 0 0 10px rgba(10, 132, 255, 0.15);
        }

        .todo-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .todo-item.pending .todo-icon {
            border: 1.5px solid rgba(255, 255, 255, 0.25);
        }

        .todo-item.done .todo-icon {
            background: #30d158;
            box-shadow: 0 0 6px rgba(48, 209, 88, 0.6);
        }

        .todo-item.done .todo-icon svg {
            width: 9px;
            height: 9px;
            fill: #000;
        }

        .todo-item.in_progress .todo-icon {
            border: 2px solid transparent;
            border-top-color: #0a84ff;
            border-right-color: #0a84ff;
            animation: spinTodoIcon 0.8s linear infinite;
        }

        @keyframes spinTodoIcon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .todo-text {
            font-size: 11.5px;
            color: #d1d1d6;
            line-height: 1.3;
            flex: 1;
            transition: color 0.25s ease;
            word-break: break-word;
        }

        .todo-item.done .todo-text {
            color: #636366;
            text-decoration: line-through;
        }

        .todo-item.in_progress .todo-text {
            color: #ffffff;
            font-weight: 500;
        }

.island-card.mode-music {
            height: 382px; /* Expanded card height with volume controller */
            padding: 14px 20px 16px 20px;
        }

        .music-section {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            margin-top: 10px;
            transition: opacity 0.35s ease;
        }

        .island-card.mode-music .music-section {
            display: flex;
            opacity: 1;
        }

        .island-card.mode-music .subtitle-row {
            display: none;
        }

        /* Album Artwork */
        .album-art-wrap {
            position: relative;
            width: 116px;
            height: 116px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 1px rgba(255, 255, 255, 0.2) inset;
            margin-bottom: 9px;
            background: #111113;
        }

        .album-art-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.16);
            transform-origin: center 36%;
            display: block;
        }

        /* Track Details */
        .track-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 7px;
            text-align: center;
        }

        .track-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .track-artist {
            font-size: 11.5px;
            font-weight: 400;
            color: #8e8e93;
            letter-spacing: -0.1px;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        /* Progress Bar / Seeker */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .progress-time {
            font-size: 10px;
            font-weight: 500;
            color: #8e8e93;
            font-variant-numeric: tabular-nums;
            min-width: 28px;
        }

        .progress-time.time-left {
            text-align: left;
        }

        .progress-time.time-right {
            text-align: right;
        }

        .progress-bar-track {
            flex: 1;
            height: 14px;
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-rail {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            overflow: visible;
            transition: height 0.15s ease;
        }

        .progress-bar-track:hover .progress-bar-rail,
        .progress-bar-track.is-dragging .progress-bar-rail {
            height: 6px;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 2px;
            pointer-events: none;
        }

        .progress-bar-knob {
            position: absolute;
            top: 50%;
            right: -5px;
            transform: translateY(-50%) scale(0.85);
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            transition: transform 0.15s ease;
            pointer-events: none;
        }

        .progress-bar-track:hover .progress-bar-knob,
        .progress-bar-track.is-dragging .progress-bar-knob {
            transform: translateY(-50%) scale(1.3);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* Media Controls */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            width: 100%;
            padding-bottom: 2px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            outline: none;
            opacity: 0.9;
        }

        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.12);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .ctrl-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            pointer-events: none;
        }

        .ctrl-btn.play-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Volume Controller */
        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 0 4px;
        }

        .volume-icon {
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.15s ease;
            flex-shrink: 0;
            padding: 2px;
        }

        .volume-icon:hover {
            color: #ffffff;
            transform: scale(1.12);
        }

        .volume-icon svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .volume-slider-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(to right, #ffffff 0%, #ffffff 80%, rgba(255, 255, 255, 0.2) 80%, rgba(255, 255, 255, 0.2) 100%);
            outline: none;
            cursor: pointer;
            transition: height 0.15s ease;
        }

        .volume-slider:hover {
            height: 5px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .volume-slider:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        .volume-slider::-moz-range-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="state-hidden">
    <!-- FULL SCREEN NEON GLOW TRAIL CANVAS -->
    <canvas id="neon-trail-canvas"></canvas>

    <div class="island-card" id="casper-card">
        <!-- EYES -->
        <div class="eyes-container" id="eyes-container">
            <div class="eye" id="eye-left">
                <div class="pupil" id="pupil-left"></div>
            </div>
            <div class="eye" id="eye-right">
                <div class="pupil" id="pupil-right"></div>
            </div>
        </div>

        <!-- STATUS ROW -->
        <div class="status-row">
            <div class="status-left">
                <div class="status-dot" id="status-dot"></div>
                <div class="status-text" id="status-text">Online · Standing by</div>
            </div>
            <div class="audio-wave" id="audio-wave">
                <div class="wave-bar bar-1"></div>
                <div class="wave-bar bar-2"></div>
                <div class="wave-bar bar-3"></div>
                <div class="wave-bar bar-4"></div>
            </div>
        </div>

        <!-- SUBTITLE ROW (Voice Assistant Mode) -->
        <div class="subtitle-row" id="subtitle-row">
            <div class="subtitle-text" id="subtitle-text">Ready for command</div>
        </div>

        <!-- MUSIC / EXPANDED SECTION -->
        <div class="music-section" id="music-section">
            <!-- Album Art -->
            <div class="album-art-wrap">
                <img class="album-art-img" id="album-art-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E" alt="Album Art">
            </div>

            <!-- Track Info -->
            <div class="track-info">
                <div class="track-title" id="track-title">Now Playing</div>
                <div class="track-artist" id="track-artist">Casper Player</div>
            </div>

            <!-- Progress Bar / Playback Timeline Seeker -->
            <div class="progress-container">
                <span class="progress-time time-left" id="time-left">0:00</span>
                <div class="progress-bar-track" id="progress-bar-track" title="Click or drag to seek">
                    <div class="progress-bar-rail">
                        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;">
                            <div class="progress-bar-knob"></div>
                        </div>
                    </div>
                </div>
                <span class="progress-time time-right" id="time-right">--:--</span>
            </div>

            <!-- Controls -->
            <div class="controls-row">
                <!-- Previous -->
                <button class="ctrl-btn" onclick="sendUICommand('CMD:PREV')" title="Previous Track">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <!-- Play / Pause -->
                <button class="ctrl-btn play-btn" onclick="togglePlayPause()" id="play-pause-btn" title="Play/Pause">
                    <svg viewBox="0 0 24 24" id="play-icon" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
                    <svg viewBox="0 0 24 24" id="pause-icon"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <!-- Next / Skip -->
                <button class="ctrl-btn" onclick="sendUICommand('CMD:SKIP')" title="Next Track">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <!-- Close Card & Stop Song -->
                <button class="ctrl-btn" onclick="stopAndCloseMusic(event)" title="Stop and Close Player" style="opacity: 0.6; margin-left: 6px;">
                    <svg viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <!-- Volume Controller -->
            <div class="volume-container">
                <span class="volume-icon" onclick="toggleMute()" id="vol-mute-btn" title="Mute/Unmute">
                    <svg viewBox="0 0 24 24" id="vol-svg-speaker"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </span>
                <div class="volume-slider-wrap">
                    <input type="range" min="0" max="100" value="80" class="volume-slider" id="volume-slider" oninput="onVolumeChange(this.value)">
                </div>
                <span class="volume-icon" onclick="setVolumeMax()" title="100% Volume">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </span>
            </div>
        </div>

        <!-- TODO / BACKGROUND WORKER CHECKLIST SECTION -->
        <div class="todo-section" id="todo-section">
            <div class="todo-header">
                <div class="todo-header-left">
                    <span class="todo-badge">DeepSeek</span>
                    <span class="todo-title" id="todo-title">Task Checklist</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="todo-counter" id="todo-counter">0/0</span>
                    <div class="todo-close-btn" onclick="collapseTodoCard()" title="Dismiss checklist" style="cursor: pointer; opacity: 0.7; display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.12); font-size: 10px; line-height: 1; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">✕</div>
                </div>
            </div>
            <div class="todo-list" id="todo-list">
                <!-- Dynamically populated checklist items -->
            </div>
        </div>

        <!-- SLIDER HANDLE (HORIZONTAL DRAG) -->
        <div class="drag-handle" title="Slide horizontally (Left / Right)">
            <div class="drag-pill"></div>
        </div>
    </div>

    <script>
        const $card = document.getElementById('casper-card');
        const $statusText = document.getElementById('status-text');
        const $statusDot = document.getElementById('status-dot');
        const $subtitleText = document.getElementById('subtitle-text');
        const $waveBars = document.querySelectorAll('.wave-bar');
        const $playIcon = document.getElementById('play-icon');
        const $pauseIcon = document.getElementById('pause-icon');
        const $pausedText = document.getElementById('music-paused-text');
        const $albumArt = document.getElementById('album-art-img');
        const $trackTitle = document.getElementById('track-title');
        const $trackArtist = document.getElementById('track-artist');
        const $eyes = document.querySelectorAll('.eye');

        let isMusicMode = false;
        let isMusicPaused = true;
        let currentState = 'idle';

        // ----------------------------------------------------
        // ULTRA-SMOOTH BLINK CONTROLLER
        // ----------------------------------------------------
        function blinkEyes(callback) {
            $eyes.forEach(eye => eye.classList.add('blinking'));
            setTimeout(() => {
                $eyes.forEach(eye => eye.classList.remove('blinking'));
                if (callback) callback();
            }, 180);
        }

        function scheduleNextBlink() {
            const delay = Math.random() * 2600 + 3000; // 3.0s to 5.6s natural interval
            setTimeout(() => {
                blinkEyes(() => {
                    // 25% chance of realistic double-blink
                    if (Math.random() < 0.25) {
                        setTimeout(() => {
                            blinkEyes(scheduleNextBlink);
                        }, 120);
                    } else {
                        scheduleNextBlink();
                    }
                });
            }, delay);
        }
        scheduleNextBlink();

        // ----------------------------------------------------
        // STATE MANAGEMENT
        // ----------------------------------------------------
        const STATE_MAP = {
            hidden: {
                status: '',
                dotColor: '#30d158',
                bodyClass: 'state-hidden',
                subtext: '',
                wave: false,
                compactEyes: false
            },
            listening: {
                status: 'Listening · Hearing you...',
                dotColor: '#30d158',
                bodyClass: 'state-listening',
                subtext: 'Listening to speech...',
                wave: true,
                compactEyes: false
            },
            speaking: {
                status: 'Speaking · Casper',
                dotColor: '#0a84ff',
                bodyClass: 'state-speaking',
                subtext: 'Casper speaking...',
                wave: true,
                compactEyes: false
            },
            thinking: {
                status: 'Thinking · Please wait',
                dotColor: '#ff9f0a',
                bodyClass: 'state-thinking',
                subtext: 'Processing...',
                wave: false,
                compactEyes: true // Eyes shrink and scan left to right (Image 2 style)
            },
            waiting: {
                status: 'Standby · Mic Muted',
                dotColor: '#8e8e93',
                bodyClass: 'state-waiting',
                subtext: 'Press Alt to unmute',
                wave: false,
                compactEyes: false
            },
            idle: {
                status: 'Online · Standing by',
                dotColor: '#30d158',
                bodyClass: 'state-idle',
                subtext: 'Ready for command',
                wave: false,
                compactEyes: false
            },
            startup: {
                status: 'Initializing · Casper',
                dotColor: '#30d158',
                bodyClass: 'state-idle',
                subtext: 'Casper online',
                wave: false,
                compactEyes: false
            },
            tool: {
                status: 'Working · Running tool',
                dotColor: '#bf5af2',
                bodyClass: 'state-tool',
                subtext: 'Executing task...',
                wave: false,
                compactEyes: true
            }
        };

        // ----------------------------------------------------
        // HOLOGRAPHIC NEON GLOW CURSOR TRAIL ENGINE
        // ----------------------------------------------------
        const trailCanvas = document.getElementById('neon-trail-canvas');
        const tCtx = trailCanvas ? trailCanvas.getContext('2d') : null;
        let trailPoints = [];
        let emberParticles = [];

        let isVisionModeActive = false;

        function resizeTrailCanvas() {
            if (!trailCanvas) return;
            trailCanvas.width = window.innerWidth;
            trailCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeTrailCanvas);
        resizeTrailCanvas();

        function addTrailPoint(x, y) {
            return; // Cursor glow / trail disabled - clean view
        }

        // Connect global cursor stream from Electron
        if (window.electronAPI && window.electronAPI.onCursorPos) {
            window.electronAPI.onCursorPos((pt) => {
                addTrailPoint(pt.x, pt.y);
            });
        }

        window.addEventListener('pointermove', (e) => {
            addTrailPoint(e.clientX, e.clientY);
        });

        // 60 FPS fluid rendering loop
        function renderNeonTrail() {
            if (!tCtx || !trailCanvas) return;
            if (!isVisionModeActive) {
                if (trailPoints.length > 0 || emberParticles.length > 0) {
                    tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
                    trailPoints = [];
                    emberParticles = [];
                }
                requestAnimationFrame(renderNeonTrail);
                return;
            }
            tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

            // 1. Draw smooth glowing ribbon
            if (trailPoints.length > 1) {
                tCtx.save();
                tCtx.lineCap = 'round';
                tCtx.lineJoin = 'round';

                for (let i = 1; i < trailPoints.length; i++) {
                    const p0 = trailPoints[i - 1];
                    const p1 = trailPoints[i];
                    const a = p1.alpha;
                    if (a <= 0.01) continue;

                    const strokeW = Math.max(0.5, p1.width * a);

                    // Outer intense Cyan Glow
                    tCtx.beginPath();
                    tCtx.moveTo(p0.x, p0.y);
                    tCtx.lineTo(p1.x, p1.y);
                    tCtx.shadowBlur = 18 * a;
                    tCtx.shadowColor = '#00f3ff';
                    tCtx.strokeStyle = `rgba(0, 243, 255, ${0.8 * a})`;
                    tCtx.lineWidth = strokeW * 2.4;
                    tCtx.stroke();

                    // Inner White Hot Core Beam
                    tCtx.beginPath();
                    tCtx.moveTo(p0.x, p0.y);
                    tCtx.lineTo(p1.x, p1.y);
                    tCtx.shadowBlur = 5 * a;
                    tCtx.shadowColor = '#ffffff';
                    tCtx.strokeStyle = `rgba(255, 255, 255, ${0.95 * a})`;
                    tCtx.lineWidth = strokeW * 0.7;
                    tCtx.stroke();
                }
                tCtx.restore();
            }

            // 2. Draw sparkling ember particles
            if (emberParticles.length > 0) {
                tCtx.save();
                for (let i = 0; i < emberParticles.length; i++) {
                    const p = emberParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.038;

                    if (p.alpha > 0) {
                        tCtx.shadowBlur = 8;
                        tCtx.shadowColor = p.color;
                        tCtx.fillStyle = p.color === '#ffffff'
                            ? `rgba(255, 255, 255, ${p.alpha})`
                            : `rgba(0, 243, 255, ${p.alpha})`;
                        tCtx.beginPath();
                        tCtx.arc(p.x, p.y, p.size * p.alpha, 0, Math.PI * 2);
                        tCtx.fill();
                    }
                }
                tCtx.restore();
                emberParticles = emberParticles.filter(p => p.alpha > 0.04);
            }

            // Age trail points over ~450ms
            for (let i = 0; i < trailPoints.length; i++) {
                trailPoints[i].alpha -= 0.042;
            }
            trailPoints = trailPoints.filter(p => p.alpha > 0.02);

            requestAnimationFrame(renderNeonTrail);
        }
        requestAnimationFrame(renderNeonTrail);

        function renderCirclePulse(data) {
            if (!data) return;
            const cx = (data.x || 0) + (data.w || 100) / 2;
            const cy = (data.y || 0) + (data.h || 100) / 2;
            // Spawn an elegant sci-fi burst of luminous particles
            for (let i = 0; i < 28; i++) {
                const angle = (Math.PI * 2 * i) / 28;
                const speed = Math.random() * 2.8 + 1.8;
                emberParticles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 3.2 + 1.5,
                    alpha: 1.0,
                    color: i % 2 === 0 ? '#00f3ff' : '#ffffff'
                });
            }
        }

        function setState(stateStr) {
            if (!stateStr) return;

            // Handle Vision mode on/off
            if (stateStr === 'VISION:ON') {
                isVisionModeActive = true;
                if ($subtitleText) {
                    $subtitleText.textContent = '[VISION MODE ENGAGED]';
                    setTimeout(() => {
                        if ($subtitleText && $subtitleText.textContent === '[VISION MODE ENGAGED]') {
                            const cfg = STATE_MAP[currentState] || STATE_MAP.idle;
                            $subtitleText.textContent = cfg.subtext || '';
                        }
                    }, 3500);
                }
                return;
            }
            if (stateStr === 'VISION:OFF') {
                isVisionModeActive = false;
                trailPoints = [];
                emberParticles = [];
                if (tCtx && trailCanvas) {
                    tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
                }
                if ($subtitleText) {
                    $subtitleText.textContent = 'Vision Mode closed';
                    setTimeout(() => {
                        if ($subtitleText && $subtitleText.textContent === 'Vision Mode closed') {
                            const cfg = STATE_MAP[currentState] || STATE_MAP.idle;
                            $subtitleText.textContent = cfg.subtext || '';
                        }
                    }, 2500);
                }
                return;
            }

            // Handle circle gesture focus pulse
            if (stateStr.startsWith('CIRCLE:')) {
                if (!isVisionModeActive) return;
                try {
                    const data = JSON.parse(stateStr.substring(7));
                    renderCirclePulse(data);
                } catch (e) {}
                return;
            }

            // Handle music stop FIRST before startsWith('MUSIC:')
            if (stateStr === 'CMD:STOP' || stateStr === 'MUSIC:STOP' || stateStr.startsWith('MUSIC:STOP')) {
                collapseMusicCard();
                return;
            }

            // Handle background worker TODO list
            if (stateStr.startsWith('TODO:')) {
                handleTodoState(stateStr.substring(5));
                return;
            }

            // Handle music state
            if (stateStr.startsWith('MUSIC:')) {
                handleMusicState(stateStr.substring(6));
                return;
            }

            // Handle custom text
            if (stateStr.startsWith('custom:')) {
                const text = stateStr.substring(7);
                applyState('tool', text);
                return;
            }

            // Handle subtext directly
            if (stateStr.startsWith('subtext:')) {
                $subtitleText.textContent = stateStr.substring(8);
                return;
            }

            applyState(stateStr);
        }

        function applyState(stateName, customText = null) {
            currentState = stateName;
            const config = STATE_MAP[stateName] || STATE_MAP.idle;

            document.body.className = config.bodyClass;
            $statusText.textContent = customText ? `Working · ${customText}` : config.status;
            $statusDot.style.backgroundColor = config.dotColor;
            $statusDot.style.boxShadow = `0 0 8px ${config.dotColor}`;

            if (customText) {
                $subtitleText.textContent = customText;
            } else if (config.subtext !== undefined) {
                $subtitleText.textContent = config.subtext;
            } else {
                $subtitleText.textContent = '';
            }

            // Audio wave bars
            $waveBars.forEach(b => {
                if (config.wave) {
                    b.classList.add('active');
                    b.style.backgroundColor = config.dotColor;
                } else {
                    b.classList.remove('active');
                    b.style.height = '4px';
                    b.style.backgroundColor = config.dotColor;
                }
            });

            // Compact eyes mode (with scanning eyeball)
            if (!isMusicMode) {
                if (config.compactEyes) {
                    $card.classList.add('mode-compact');
                } else {
                    $card.classList.remove('mode-compact');
                }
            }
        }

        // ----------------------------------------------------
        // MUSIC CARD (Image 2)
        // ----------------------------------------------------
        function handleMusicState(musicData) {
            let title = musicData;
            let imgUrl = '';
            let artist = 'Casper Player';
            let dur = 0;

            // Extract DUR if present
            const durMatch = musicData.match(/\|DUR:(\d+)/);
            if (durMatch) {
                dur = parseInt(durMatch[1], 10) || 0;
                musicData = musicData.replace(/\|DUR:\d+/, '');
            }

            // Extract IMG if present
            const imgMatch = musicData.match(/\|IMG:([^|]+)/);
            if (imgMatch) {
                imgUrl = imgMatch[1];
                musicData = musicData.replace(/\|IMG:[^|]+/, '');
            }

            title = musicData.trim();

            // Parse track name & artist if formatted as "Artist - Title" or "Title by Artist"
            if (title.includes(' - ')) {
                const tParts = title.split(' - ');
                artist = tParts[0].trim();
                title = tParts[1].trim();
            } else if (title.includes(' by ')) {
                const tParts = title.split(' by ');
                title = tParts[0].trim();
                artist = tParts[1].trim();
            }

            $trackTitle.textContent = title || 'Now Playing';
            $trackArtist.textContent = artist || 'Casper Player';

            if (imgUrl) {
                $albumArt.src = imgUrl;
            } else {
                $albumArt.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/%3E%3C/svg%3E";
            }

            currentSongDuration = dur;
            musicElapsed = 0;
            expandMusicCard();
            setMusicPaused(false);
            startProgressTimer();
        }

        // ----------------------------------------------------
        // TODO CHECKLIST / BACKGROUND WORKER OVERLAY LOGIC
        // ----------------------------------------------------
        let isTodoMode = false;
        let todoCollapseTimer = null;
        let todoInactivityTimer = null;

        function handleTodoState(jsonStr) {
            try {
                const data = JSON.parse(jsonStr);
                renderTodoList(data);
            } catch (e) {
                console.error('Failed to parse TODO state:', e);
            }
        }

        function renderTodoList(data) {
            const { title, todos, all_done } = data;
            const $todoTitle = document.getElementById('todo-title');
            const $todoCounter = document.getElementById('todo-counter');
            const $todoList = document.getElementById('todo-list');

            if (!todos || todos.length === 0) return;

            // Expand into todo mode
            if (!isTodoMode) {
                isTodoMode = true;
                $card.classList.add('mode-todo');
                $card.classList.remove('mode-music');
                applyState('tool', title || 'Executing DeepSeek plan...');
            }

            // Reset inactivity watchdog (auto-collapses if idle for 10 minutes)
            if (todoInactivityTimer) clearTimeout(todoInactivityTimer);
            todoInactivityTimer = setTimeout(() => {
                collapseTodoCard();
            }, 600000);

            if (title && $todoTitle) {
                $todoTitle.textContent = title;
            }

            const doneCount = all_done ? todos.length : todos.filter(t => t.status === 'done').length;
            if ($todoCounter) {
                $todoCounter.textContent = `${doneCount}/${todos.length}`;
            }

            // Build checklist items
            $todoList.innerHTML = '';
            todos.forEach(item => {
                const div = document.createElement('div');
                const isItemDone = all_done || item.status === 'done';
                const status = isItemDone ? 'done' : (item.status || 'pending');
                div.className = `todo-item ${status}`;
                
                let iconHtml = '';
                if (status === 'done') {
                    iconHtml = '<div class="todo-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>';
                } else {
                    iconHtml = '<div class="todo-icon"></div>';
                }

                const label = item.text || item.task || 'Step';
                div.innerHTML = `${iconHtml}<div class="todo-text">${label}</div>`;
                $todoList.appendChild(div);
            });

            if (all_done) {
                if ($todoCounter) $todoCounter.textContent = '✓ Done';
                applyState('idle', 'All tasks finished!');
                if (todoCollapseTimer) clearTimeout(todoCollapseTimer);
                todoCollapseTimer = setTimeout(() => {
                    collapseTodoCard();
                }, 4000);
            } else {
                if (todoCollapseTimer) {
                    clearTimeout(todoCollapseTimer);
                    todoCollapseTimer = null;
                }
            }
        }

        function collapseTodoCard() {
            if (todoInactivityTimer) {
                clearTimeout(todoInactivityTimer);
                todoInactivityTimer = null;
            }
            if (todoCollapseTimer) {
                clearTimeout(todoCollapseTimer);
                todoCollapseTimer = null;
            }
            isTodoMode = false;
            $card.classList.remove('mode-todo');
            const targetState = currentState && currentState !== 'hidden' ? currentState : 'idle';
            applyState(targetState);
        }

        function expandMusicCard() {
            isMusicMode = true;
            $card.classList.add('mode-music');
            $card.classList.remove('mode-compact');
        }

        function collapseMusicCard() {
            isMusicMode = false;
            isScrubbing = false;
            stopProgressTimer();
            $card.classList.remove('mode-music');
            
            // Explicitly restore original Casper state and eyes
            const targetState = currentState && currentState !== 'hidden' ? currentState : 'listening';
            applyState(targetState);

            musicElapsed = 0;
            currentSongDuration = 0;
            updateProgressUI(0);
        }

        function stopAndCloseMusic(e) {
            if (e) {
                try {
                    e.preventDefault();
                    e.stopPropagation();
                } catch (err) {}
            }
            sendUICommand('CMD:STOP');
            collapseMusicCard();
        }

        function togglePlayPause() {
            if (isMusicPaused) {
                sendUICommand('CMD:RESUME');
                setMusicPaused(false);
            } else {
                sendUICommand('CMD:PAUSE');
                setMusicPaused(true);
            }
        }

        function setMusicPaused(paused) {
            isMusicPaused = paused;
            if (paused) {
                $playIcon.style.display = 'block';
                $pauseIcon.style.display = 'none';
                if ($pausedText) $pausedText.textContent = 'PAUSED';
            } else {
                $playIcon.style.display = 'none';
                $pauseIcon.style.display = 'block';
                if ($pausedText) $pausedText.textContent = 'PLAYING';
            }
        }

        // ----------------------------------------------------
        // DYNAMIC PROGRESS TIMER & TIMELINE SEEKER
        // ----------------------------------------------------
        let currentSongDuration = 0;
        let musicElapsed = 0;
        let progressTimer = null;
        let isScrubbing = false;

        function formatTime(sec) {
            sec = Math.max(0, Math.floor(sec));
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateProgressUI(sec) {
            const curSec = (typeof sec === 'number') ? sec : musicElapsed;
            const $tl = document.getElementById('time-left');
            const $tr = document.getElementById('time-right');
            const $fill = document.getElementById('progress-bar-fill');

            if ($tl) $tl.textContent = formatTime(curSec);
            if ($tr) {
                if (currentSongDuration > 0) {
                    $tr.textContent = formatTime(currentSongDuration);
                } else {
                    $tr.textContent = '--:--';
                }
            }

            if ($fill) {
                const pct = currentSongDuration > 0
                    ? Math.max(0, Math.min(100, (curSec / currentSongDuration) * 100))
                    : 0;
                $fill.style.width = `${pct}%`;
            }
        }

        function startProgressTimer() {
            stopProgressTimer();
            updateProgressUI(musicElapsed);
            progressTimer = setInterval(() => {
                if (isMusicMode && !isMusicPaused && !isScrubbing) {
                    musicElapsed++;
                    if (currentSongDuration > 0 && musicElapsed > currentSongDuration) {
                        musicElapsed = currentSongDuration;
                    }
                    updateProgressUI(musicElapsed);
                }
            }, 1000);
        }

        function stopProgressTimer() {
            if (progressTimer) {
                clearInterval(progressTimer);
                progressTimer = null;
            }
        }

        function setupTimelineSeeker() {
            const $track = document.getElementById('progress-bar-track');
            if (!$track) return;

            function calculateSecFromEvent(e) {
                if (!currentSongDuration || currentSongDuration <= 0) return 0;
                const rect = $track.getBoundingClientRect();
                const clickX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
                const ratio = clickX / rect.width;
                return Math.round(ratio * currentSongDuration);
            }

            $track.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                isScrubbing = true;
                $track.classList.add('is-dragging');

                const targetSec = calculateSecFromEvent(e);
                musicElapsed = targetSec;
                updateProgressUI(targetSec);

                function onMouseMove(moveEvent) {
                    if (!isScrubbing) return;
                    const sec = calculateSecFromEvent(moveEvent);
                    musicElapsed = sec;
                    updateProgressUI(sec);
                }

                function onMouseUp(upEvent) {
                    if (isScrubbing) {
                        isScrubbing = false;
                        $track.classList.remove('is-dragging');
                        const finalSec = calculateSecFromEvent(upEvent);
                        musicElapsed = finalSec;
                        updateProgressUI(finalSec);
                        sendUICommand('CMD:SEEK:' + finalSec);
                    }
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                }

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        }

        // ----------------------------------------------------
        // VOLUME CONTROLLER
        // ----------------------------------------------------
        let currentVolume = 80;
        let previousVolume = 80;
        let lastVolumeSend = 0;
        let volumeSendTimeout = null;

        const MUTE_SVG = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        const SPEAKER_LOW_SVG = '<path d="M7 9v6h4l5 5V4l-5 5H7z"/>';
        const SPEAKER_MED_SVG = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';

        function updateVolumeUI(val) {
            const $slider = document.getElementById('volume-slider');
            const $icon = document.getElementById('vol-svg-speaker');
            if ($slider) {
                $slider.style.background = `linear-gradient(to right, #ffffff 0%, #ffffff ${val}%, rgba(255, 255, 255, 0.2) ${val}%, rgba(255, 255, 255, 0.2) 100%)`;
            }
            if ($icon) {
                if (val <= 0) {
                    $icon.innerHTML = MUTE_SVG;
                } else if (val < 45) {
                    $icon.innerHTML = SPEAKER_LOW_SVG;
                } else {
                    $icon.innerHTML = SPEAKER_MED_SVG;
                }
            }
        }

        function onVolumeChange(val) {
            currentVolume = parseInt(val, 10);
            updateVolumeUI(currentVolume);

            const now = Date.now();
            if (now - lastVolumeSend > 50) {
                lastVolumeSend = now;
                sendUICommand('CMD:VOLUME:' + currentVolume);
            } else {
                clearTimeout(volumeSendTimeout);
                volumeSendTimeout = setTimeout(() => {
                    lastVolumeSend = Date.now();
                    sendUICommand('CMD:VOLUME:' + currentVolume);
                }, 50);
            }
        }

        function toggleMute() {
            const $slider = document.getElementById('volume-slider');
            if (currentVolume > 0) {
                previousVolume = currentVolume;
                currentVolume = 0;
            } else {
                currentVolume = previousVolume || 80;
            }
            if ($slider) $slider.value = currentVolume;
            updateVolumeUI(currentVolume);
            sendUICommand('CMD:VOLUME:' + currentVolume);
        }

        function setVolumeMax() {
            const $slider = document.getElementById('volume-slider');
            currentVolume = 100;
            if ($slider) $slider.value = 100;
            updateVolumeUI(100);
            sendUICommand('CMD:VOLUME:100');
        }

        // ----------------------------------------------------
        // COMMAND DISPATCHER (Electron & PySide6 Compatible)
        // ----------------------------------------------------
        function sendUICommand(cmd) {
            console.log('UI_CMD:' + cmd); // Intercepted by PySide6 QWebEnginePage

            if (window.electronAPI && window.electronAPI.sendUICommand) {
                window.electronAPI.sendUICommand(cmd);
            }
        }

        // Electron IPC listener
        if (window.electronAPI && window.electronAPI.onUIState) {
            window.electronAPI.onUIState((state) => {
                setState(state);
            });
        }

        // Electron Mouse Event forwarding
        $card.addEventListener('mouseenter', () => {
            if (window.electronAPI && window.electronAPI.setIgnoreMouseEvents) {
                window.electronAPI.setIgnoreMouseEvents(false);
            }
        });
        $card.addEventListener('mouseleave', (e) => {
            if (isDraggingCard) return;
            if (window.electronAPI && window.electronAPI.setIgnoreMouseEvents) {
                window.electronAPI.setIgnoreMouseEvents(true, { forward: true });
            }
        });

        // ----------------------------------------------------
        // HORIZONTAL SLIDER INTERACTION (Left & Right Only)
        // ----------------------------------------------------
        let isDraggingCard = false;
        let dragStartClientX = 0;
        let dragStartLeft = 0;

        function applyCardX(newLeft) {
            const cardWidth = $card.offsetWidth || 292;
            const maxLeft = Math.max(0, window.innerWidth - cardWidth);
            const clampedLeft = Math.max(0, Math.min(maxLeft, Math.round(newLeft)));
            $card.style.setProperty('--card-x', `${clampedLeft}px`);
            $card.style.left = `${clampedLeft}px`;
            return clampedLeft;
        }

        function initCardPosition() {
            const cardWidth = $card.offsetWidth || 292;
            const defaultX = Math.round((window.innerWidth - cardWidth) / 2);
            let initialX = defaultX;
            try {
                const savedX = localStorage.getItem('casper_slider_x');
                if (savedX !== null) {
                    const parsed = parseFloat(savedX);
                    if (!isNaN(parsed)) {
                        initialX = parsed;
                    }
                }
            } catch (err) {}
            applyCardX(initialX);
        }

        initCardPosition();

        window.addEventListener('resize', () => {
            const currentLeft = parseFloat($card.style.left);
            if (!isNaN(currentLeft)) {
                applyCardX(currentLeft);
            }
        });

        $card.addEventListener('dblclick', (e) => {
            if (e.target.closest('button, input, .progress-container, .ctrl-btn, .progress-bar-track, .volume-slider, #album-art-img')) {
                return;
            }
            const cardWidth = $card.offsetWidth || 292;
            const centerX = Math.round((window.innerWidth - cardWidth) / 2);
            applyCardX(centerX);
            try {
                localStorage.setItem('casper_slider_x', centerX);
            } catch (err) {}
        });

        $card.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('button, input, .progress-container, .ctrl-btn, .progress-bar-track, .volume-slider, #album-art-img')) {
                return;
            }

            e.preventDefault();
            isDraggingCard = true;
            $card.classList.add('is-dragging');
            dragStartClientX = e.clientX;
            dragStartLeft = $card.getBoundingClientRect().left;

            try {
                $card.setPointerCapture(e.pointerId);
            } catch (err) {}

            if (window.electronAPI && window.electronAPI.setIgnoreMouseEvents) {
                window.electronAPI.setIgnoreMouseEvents(false);
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDraggingCard) return;
            const deltaX = e.clientX - dragStartClientX;
            const newLeft = dragStartLeft + deltaX;
            applyCardX(newLeft);
        });

        function endCardDrag(e) {
            if (!isDraggingCard) return;
            isDraggingCard = false;
            $card.classList.remove('is-dragging');

            try {
                if (e && e.pointerId && $card.hasPointerCapture && $card.hasPointerCapture(e.pointerId)) {
                    $card.releasePointerCapture(e.pointerId);
                }
            } catch (err) {}

            const currentLeft = parseFloat($card.style.left);
            if (!isNaN(currentLeft)) {
                try {
                    localStorage.setItem('casper_slider_x', currentLeft);
                } catch (err) {}
            }

            const rect = $card.getBoundingClientRect();
            if (e && (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom)) {
                if (window.electronAPI && window.electronAPI.setIgnoreMouseEvents) {
                    window.electronAPI.setIgnoreMouseEvents(true, { forward: true });
                }
            }
        }

        window.addEventListener('pointerup', endCardDrag);
        window.addEventListener('pointercancel', endCardDrag);
        window.addEventListener('blur', () => {
            if (isDraggingCard) {
                endCardDrag();
            }
        });

        // ----------------------------------------------------
        // INTERACTIVE STATE HOTKEYS (Numeric 0-3)
        // ----------------------------------------------------
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                collapseMusicCard();
                setState('listening');
            } else if (e.key === '2') {
                collapseMusicCard();
                setState('thinking');
            } else if (e.key === '3') {
                collapseMusicCard();
                setState('speaking');
            } else if (e.key === '0') {
                collapseMusicCard();
                setState('idle');
            }
        });

        setupTimelineSeeker();
        if (window.electronAPI) {
            setState('hidden');
        } else {
            setState('idle');
        }
    </script>
</body>
</html>
